<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
<link rel="stylesheet" href="{{ url_for('static', filename='loginuser.css') }}">
<script src="{{ url_for('static', filename='loginuser.js') }}"></script>
</head>
<body>
  <div class="container">
    <button class="back-btn" onclick="goHome()">กลับหน้าหลัก</button>
    <h2>เข้าสู่ระบบ</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="อีเมล" required>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="รหัสผ่าน" required>
        <span class="toggle-password" onclick="togglePassword()">👁</span>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">จำฉันเข้าสู่ระบบ</label>
      </div>

      <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
    </form>

    <div class="divider">หรือเข้าสู่ระบบด้วย</div>

    <button class="social-btn facebook">เข้าสู่ระบบด้วย Facebook</button>
    <button class="social-btn google">เข้าสู่ระบบด้วย Google</button>

    <div class="signup">
      ไม่ใช่สมาชิก ? <a href="#">สมัครสมาชิก</a>
    </div>
    <div class="forgot">
      <a href="#">ลืมรหัสผ่าน ?</a>
    </div>
  </div>

  <script src="loginuser.js"></script>
</body>
</html>
